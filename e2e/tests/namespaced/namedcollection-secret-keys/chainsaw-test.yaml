apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: namedcollection-secret-keys-namespaced
# Validates a namespaced NamedCollection mixing plain keys with write-only
# secret keys (secret_keys_wo) read from a Kubernetes Secret. Every key of the
# Secret must land in ClickHouse, and bumping secretKeysWoVersion must re-apply
# a rotated secret value.
#
# Uses the cluster-scoped ClusterProviderConfig "default" from the e2e setup
# script. A dedicated ClickHouse name (nnc) avoids colliding with uptest manifests.
spec:
  timeouts:
    delete: 5m
    cleanup: 5m
  steps:
    - name: apply-collection
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: nnc-secret
              stringData:
                secret_access_key: s3cr3t-v1
        - apply:
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: NamedCollection
              metadata:
                name: nnc
              spec:
                forProvider:
                  name: nnc
                  keys:
                    url: https://example.com/bucket/
                  notOverridableKeys:
                    - secret_access_key
                  secretKeysWoSecretRef:
                    name: nnc-secret
                  secretKeysWoVersion: 1
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
        - assert:
            timeout: 5m
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: NamedCollection
              metadata:
                name: nnc
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
                (conditions[?type == 'Synced']):
                  - status: "True"
        - script:
            shell: bash
            content: |
              set -euo pipefail
              VAL=$(kubectl exec -n clickhouse deploy/clickhouse -- clickhouse-client \
                --user default --password e2epassword \
                --query "SELECT collection['secret_access_key'] FROM system.named_collections WHERE name = 'nnc'")
              [ "$VAL" = "s3cr3t-v1" ] || { echo "FAIL: expected s3cr3t-v1, got '$VAL'"; exit 1; }
              URL=$(kubectl exec -n clickhouse deploy/clickhouse -- clickhouse-client \
                --user default --password e2epassword \
                --query "SELECT collection['url'] FROM system.named_collections WHERE name = 'nnc'")
              [ "$URL" = "https://example.com/bucket/" ] || { echo "FAIL: unexpected url '$URL'"; exit 1; }

    - name: rotate-secret
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: nnc-secret
              stringData:
                secret_access_key: s3cr3t-v2
        - patch:
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: NamedCollection
              metadata:
                name: nnc
              spec:
                forProvider:
                  secretKeysWoVersion: 2
        - script:
            timeout: 5m
            shell: bash
            content: |
              set -euo pipefail
              for _ in $(seq 1 60); do
                VAL=$(kubectl exec -n clickhouse deploy/clickhouse -- clickhouse-client \
                  --user default --password e2epassword \
                  --query "SELECT collection['secret_access_key'] FROM system.named_collections WHERE name = 'nnc'")
                [ "$VAL" = "s3cr3t-v2" ] && exit 0
                sleep 5
              done
              echo "FAIL: expected s3cr3t-v2, got '$VAL'"; exit 1
      finally:
        - delete:
            ref:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: NamedCollection
              name: nnc
        - script:
            timeout: 5m
            shell: bash
            content: |
              set -euo pipefail
              for _ in $(seq 1 60); do
                N=$(kubectl exec -n clickhouse deploy/clickhouse -- clickhouse-client \
                  --user default --password e2epassword \
                  --query "SELECT count() FROM system.named_collections WHERE name = 'nnc'")
                [ "$N" -eq 0 ] && exit 0
                sleep 5
              done
              echo "FAIL: named collection nnc still exists"; exit 1
