apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: settingprofile-observe-by-name
# Validates the adopt-by-name path for a namespaced SettingProfile (id
# observation field). A sibling Observe-only profile referencing an existing
# profile by name must be adopted (Synced/Ready), not re-created.
#
# Uses a namespaced clickhousedbops.m.crossplane.io ProviderConfig created in the
# test namespace, and a dedicated ClickHouse name (obsprofile) so it never
# collides with the uptest manifest profile (testprofile).
spec:
  steps:
  - name: setup-providerconfig
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: provider-secret
          type: Opaque
          stringData:
            credentials: |
              {"host":"clickhouse.clickhouse.svc.cluster.local","port":9000,"protocol":"native","auth_config":{"strategy":"password","username":"default","password":"e2epassword"}}
    - apply:
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1beta1
          kind: ProviderConfig
          metadata:
            name: default
          spec:
            credentials:
              source: Secret
              secretRef:
                name: provider-secret
                namespace: ($namespace)
                key: credentials

  - name: apply-settingprofile
    try:
    - apply:
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: SettingProfile
          metadata:
            name: obsprofile
          spec:
            forProvider:
              name: obsprofile
            providerConfigRef:
              name: default
    - assert:
        timeout: 5m
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: SettingProfile
          metadata:
            name: obsprofile
          status:
            conditions:
            - type: Ready
              status: "True"

  - name: observe-sibling-by-name
    try:
    - apply:
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: SettingProfile
          metadata:
            name: obsprofile-observe
          spec:
            forProvider:
              name: obsprofile
            managementPolicies:
            - Observe
            providerConfigRef:
              name: default
    - assert:
        timeout: 5m
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: SettingProfile
          metadata:
            name: obsprofile-observe
          status:
            conditions:
            - type: Synced
              status: "True"
            - type: Ready
              status: "True"
    finally:
    - delete:
        ref:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: SettingProfile
          name: obsprofile-observe
