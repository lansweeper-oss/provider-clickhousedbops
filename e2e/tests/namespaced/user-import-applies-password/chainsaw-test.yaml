apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: user-import-applies-password-namespaced
# Validates the AdoptHook half of the issue #104 fix for a namespaced User:
# importing an existing ClickHouse user by pinned UUID with full management
# policies must apply the spec's password to the live user (ALTER USER ...
# IDENTIFIED WITH sha256_hash), so the connection secret is truthful from the
# moment of adoption. Proven by logging in with the secret's password and by
# the pre-existing password no longer working.
#
# Namespaced (clickhousedbops.m.crossplane.io) resources use the cluster-scoped
# ClusterProviderConfig "default" from the e2e setup script. A dedicated ClickHouse
# name (nimpuser) avoids colliding with the other user tests and uptest manifests.
spec:
  # Provider deletes are async (create/poll), so cleanup can exceed the default
  # delete timeout; give finally/cleanup deletes room to finish.
  timeouts:
    delete: 5m
    cleanup: 5m
    exec: 3m
  steps:
    - name: import-preexisting-user-by-uuid
      try:
        # Create the user out-of-band (as if it predates Crossplane) and capture its
        # UUID. Script and apply must share a step: bindings do not leak across steps.
        - script:
            shell: bash
            content: |
              set -euo pipefail
              kubectl wait -n clickhouse deploy/clickhouse --for=condition=Available --timeout=120s
              kubectl exec -n clickhouse deploy/clickhouse -- clickhouse-client \
                --user default --password e2epassword --query \
                "CREATE USER IF NOT EXISTS nimpuser IDENTIFIED WITH sha256_password BY 'preexisting-password'"
              kubectl exec -n clickhouse deploy/clickhouse -- clickhouse-client \
                --user default --password e2epassword --query \
                "SELECT toString(id) FROM system.users WHERE name = 'nimpuser'"
            outputs:
              - name: useruuid
                value: (trim_space($stdout))
        - apply:
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: nimpuser
                annotations:
                  crossplane.io/external-name: ($useruuid)
              spec:
                forProvider:
                  name: nimpuser
                  autoGeneratePassword: true
                writeConnectionSecretToRef:
                  name: nimpuser
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
        - assert:
            timeout: 5m
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: nimpuser
              status:
                (conditions[?type == 'Synced']):
                  - status: "True"
                (conditions[?type == 'Ready']):
                  - status: "True"

    - name: verify-live-password-matches-secret
      try:
        # The secret's password must authenticate (AdoptHook applied the spec's
        # hash) and the pre-existing password must be dead (proof ALTER USER ran,
        # not a silent adoption keeping the old credential).
        - script:
            shell: bash
            content: |
              set -euo pipefail
              PASS=$(kubectl get secret nimpuser -n $NAMESPACE -o jsonpath='{.data.password}' | base64 -d)
              RES=$(kubectl exec -n clickhouse deploy/clickhouse -- clickhouse-client \
                --user nimpuser --password "$PASS" --query "SELECT 1")
              [ "$RES" = "1" ] || { echo "FAIL: secret password cannot authenticate"; exit 1; }
              if kubectl exec -n clickhouse deploy/clickhouse -- clickhouse-client \
                --user nimpuser --password 'preexisting-password' --query "SELECT 1" 2>/dev/null; then
                echo "FAIL: pre-existing password still authenticates - spec password was not applied"
                exit 1
              fi
      finally:
        # Delete the MR while the test namespace still exists; full management
        # policies drop the ClickHouse user. The DROP is a best-effort safety net
        # for runs that fail before adoption.
        - delete:
            ref:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              name: nimpuser
        - script:
            shell: bash
            content: |
              kubectl exec -n clickhouse deploy/clickhouse -- clickhouse-client \
                --user default --password e2epassword --query "DROP USER IF EXISTS nimpuser" || true
