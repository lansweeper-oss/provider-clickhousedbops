apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: role-observe-by-name
# Validates the adopt-by-name path for a namespaced Role (id observation field).
# A sibling Observe-only Role referencing an existing role by name must be
# adopted (Synced/Ready), not re-created — CREATE ROLE is not idempotent.
#
# Uses a namespaced clickhousedbops.m.crossplane.io ProviderConfig created in the
# test namespace, and a dedicated ClickHouse name (obsrole) so it never collides
# with the uptest manifest role (testrole).
spec:
  steps:
  - name: setup-providerconfig
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: provider-secret
          type: Opaque
          stringData:
            credentials: |
              {"host":"clickhouse.clickhouse.svc.cluster.local","port":9000,"protocol":"native","auth_config":{"strategy":"password","username":"default","password":"e2epassword"}}
    - apply:
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1beta1
          kind: ProviderConfig
          metadata:
            name: default
          spec:
            credentials:
              source: Secret
              secretRef:
                name: provider-secret
                namespace: ($namespace)
                key: credentials

  - name: apply-role
    try:
    - apply:
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: Role
          metadata:
            name: obsrole
          spec:
            forProvider:
              name: obsrole
            providerConfigRef:
              name: default
    - assert:
        timeout: 5m
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: Role
          metadata:
            name: obsrole
          status:
            conditions:
            - type: Ready
              status: "True"

  - name: observe-sibling-by-name
    try:
    - apply:
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: Role
          metadata:
            name: obsrole-observe
          spec:
            forProvider:
              name: obsrole
            managementPolicies:
            - Observe
            providerConfigRef:
              name: default
    - assert:
        timeout: 5m
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: Role
          metadata:
            name: obsrole-observe
          status:
            conditions:
            - type: Synced
              status: "True"
            - type: Ready
              status: "True"
    finally:
    - delete:
        ref:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: Role
          name: obsrole-observe
