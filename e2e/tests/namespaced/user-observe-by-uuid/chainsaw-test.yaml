apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: user-observe-by-uuid-namespaced
# Validates explicit UUID import for a namespaced User
# (clickhousedbops.m.crossplane.io, id observation field). Users are never adopted
# by name (issue #104): a sibling Observe-only User must pin
# crossplane.io/external-name to the existing user's UUID to be adopted
# (Synced/Ready). Password validation is skipped for Observe-only resources, so
# the sibling needs only the name and the pinned UUID.
#
# Namespaced (clickhousedbops.m.crossplane.io) resources use the cluster-scoped
# ClusterProviderConfig "default" from the e2e setup script. A dedicated ClickHouse name
# (nobsuser) avoids colliding with the cluster observe test and uptest manifests; creating
# the same ClickHouse user twice fails with "already exists in local_directory".
spec:
  # Provider deletes are async (create/poll), so cleanup can exceed the default
  # delete timeout; give finally/cleanup deletes room to finish.
  timeouts:
    delete: 5m
    cleanup: 5m
  steps:
    - name: apply-user
      try:
        - apply:
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: nobsuser
              spec:
                forProvider:
                  name: nobsuser
                  autoGeneratePassword: true
                writeConnectionSecretToRef:
                  name: nobsuser
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
        - assert:
            timeout: 5m
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: nobsuser
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
        - assert:
            timeout: 2m
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: nobsuser
                annotations:
                  (crossplane.io/external-name != ''): true

    - name: observe-sibling-by-uuid
      try:
        # Capture the provider-assigned UUID (external-name) into a binding. Keeping this
        # in the same step as the apply below is required for the $useruuid binding to be
        # in scope; bindings do not leak across steps.
        - script:
            shell: bash
            content: |
              set -euo pipefail
              kubectl get user.clickhousedbops.m.crossplane.io nobsuser -n $NAMESPACE \
                -o go-template='{{index .metadata.annotations "crossplane.io/external-name"}}'
            outputs:
              - name: useruuid
                value: (trim_space($stdout))
        - apply:
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: nobsuser-observe
                annotations:
                  crossplane.io/external-name: ($useruuid)
              spec:
                forProvider:
                  name: nobsuser
                managementPolicies:
                  - Observe
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
        - assert:
            timeout: 5m
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: nobsuser-observe
              status:
                (conditions[?type == 'Synced']):
                  - status: "True"
                (conditions[?type == 'Ready']):
                  - status: "True"
      finally:
        # Delete order matters: remove the managed resources while the test namespace
        # still exists. Sibling first (Observe-only, no ClickHouse change) then the
        # managed user, keeps cleanup deterministic and namespace-safe.
        - delete:
            ref:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              name: nobsuser-observe
        - delete:
            ref:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              name: nobsuser
