apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: user-observe-by-uuid-namespaced
# Explicit UUID import for a namespaced User: users are never adopted by name
# (#104), so an Observe-only sibling must pin crossplane.io/external-name to the
# existing user's UUID to reach Synced/Ready. Dedicated name (nobsuser); uses
# ClusterProviderConfig "default".
spec:
  # Provider deletes are async (create/poll), so cleanup can exceed the default
  # delete timeout; give finally/cleanup deletes room to finish.
  timeouts:
    delete: 5m
    cleanup: 5m
  steps:
    - name: apply-user
      try:
        - apply:
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: nobsuser
              spec:
                forProvider:
                  name: nobsuser
                  autoGeneratePassword: true
                writeConnectionSecretToRef:
                  name: nobsuser
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
        - assert:
            timeout: 5m
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: nobsuser
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
        - assert:
            timeout: 2m
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: nobsuser
                annotations:
                  (crossplane.io/external-name != ''): true

    - name: observe-sibling-by-uuid
      try:
        # Capture the UUID into a binding; same step as the apply below because
        # bindings do not leak across steps.
        - script:
            shell: bash
            content: |
              set -euo pipefail
              kubectl get user.clickhousedbops.m.crossplane.io nobsuser -n $NAMESPACE \
                -o go-template='{{index .metadata.annotations "crossplane.io/external-name"}}'
            outputs:
              - name: useruuid
                value: (trim_space($stdout))
        - apply:
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: nobsuser-observe
                annotations:
                  crossplane.io/external-name: ($useruuid)
              spec:
                forProvider:
                  name: nobsuser
                managementPolicies:
                  - Observe
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
        - assert:
            timeout: 5m
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: nobsuser-observe
              status:
                (conditions[?type == 'Synced']):
                  - status: "True"
                (conditions[?type == 'Ready']):
                  - status: "True"
      finally:
        # Delete while the test namespace exists; sibling first, then the managed user.
        - delete:
            ref:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              name: nobsuser-observe
        - delete:
            ref:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              name: nobsuser
