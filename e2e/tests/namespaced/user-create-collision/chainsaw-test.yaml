apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: user-create-collision-namespaced
# Namespaced User colliding on forProvider.name must not adopt (#104):
# CREATE USER fails and "already exists" surfaces as Synced=False on the MR.
# Dedicated name (ncoluser); uses ClusterProviderConfig "default".
spec:
  # Provider deletes are async (create/poll), so cleanup can exceed the default
  # delete timeout; give finally/cleanup deletes room to finish.
  timeouts:
    delete: 5m
    cleanup: 5m
  steps:
    - name: apply-user
      try:
        - apply:
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: ncoluser
              spec:
                forProvider:
                  name: ncoluser
                  autoGeneratePassword: true
                writeConnectionSecretToRef:
                  name: ncoluser
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
        - assert:
            timeout: 5m
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: ncoluser
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"

    - name: collide-on-name
      try:
        - apply:
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: ncoluser-collide
              spec:
                forProvider:
                  name: ncoluser
                  autoGeneratePassword: true
                writeConnectionSecretToRef:
                  name: ncoluser-collide
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
        # Loud failure on the Synced condition; Ready would mean silent adoption.
        - assert:
            timeout: 5m
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: ncoluser-collide
              status:
                (conditions[?type == 'Synced']):
                  - status: "False"
                    (contains(message, 'already exists')): true
        - error:
            timeout: 30s
            resource:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: ncoluser-collide
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
      finally:
        # Delete while the test namespace exists; the colliding MR resolves via
        # "not found" (its external resource was never created).
        - delete:
            ref:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              name: ncoluser-collide
        - delete:
            ref:
              apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
              kind: User
              name: ncoluser
