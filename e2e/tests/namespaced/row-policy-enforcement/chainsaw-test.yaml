apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: row-policy-enforcement-namespaced
# Validates full row-policy lifecycle for namespaced resources: creates a
# database, table, two users, a row policy that filters rows per user, then
# verifies ClickHouse enforces it by querying as each user and checking the
# returned row count.
#
# Namespaced (clickhousedbops.m.crossplane.io) resources use the cluster-scoped
# ClusterProviderConfig "default" from the e2e setup script. Dedicated names
# (nrp*) avoid colliding with other tests.
spec:
  timeouts:
    delete: 5m
    cleanup: 5m
  steps:
  - name: create-database
    try:
    - apply:
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: Database
          metadata:
            name: nrpdb
          spec:
            forProvider:
              name: nrpdb
            providerConfigRef:
              kind: ClusterProviderConfig
              name: default
    - assert:
        timeout: 5m
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: Database
          metadata:
            name: nrpdb
          status:
            (conditions[?type == 'Ready']):
            - status: "True"

  - name: create-table-and-data
    try:
    - script:
        shell: bash
        content: |
          set -euo pipefail
          kubectl wait -n clickhouse deploy/clickhouse --for=condition=Available --timeout=120s
          kubectl exec -n clickhouse deploy/clickhouse -- clickhouse-client \
            --user default --password e2epassword --query "
              CREATE TABLE IF NOT EXISTS nrpdb.events (
                tenant String,
                value  UInt32
              ) ENGINE = MergeTree() ORDER BY tenant;
              INSERT INTO nrpdb.events VALUES
                ('alice', 1), ('alice', 2),
                ('bob', 3), ('bob', 4), ('bob', 5);
            "
    - script:
        shell: bash
        content: |
          set -euo pipefail
          COUNT=$(kubectl exec -n clickhouse deploy/clickhouse -- clickhouse-client \
            --user default --password e2epassword \
            --query "SELECT count() FROM nrpdb.events")
          [ "$COUNT" -eq 5 ] || { echo "FAIL: expected 5 rows, got $COUNT"; exit 1; }

  - name: create-users
    try:
    - apply:
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: User
          metadata:
            name: nrpalice
          spec:
            forProvider:
              name: nrpalice
              autoGeneratePassword: true
            writeConnectionSecretToRef:
              name: nrpalice
            providerConfigRef:
              kind: ClusterProviderConfig
              name: default
    - apply:
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: User
          metadata:
            name: nrpbob
          spec:
            forProvider:
              name: nrpbob
              autoGeneratePassword: true
            writeConnectionSecretToRef:
              name: nrpbob
            providerConfigRef:
              kind: ClusterProviderConfig
              name: default
    - assert:
        timeout: 5m
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: User
          metadata:
            name: nrpalice
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 5m
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: User
          metadata:
            name: nrpbob
          status:
            (conditions[?type == 'Ready']):
            - status: "True"

  - name: grant-select
    try:
    - apply:
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: GrantPrivilege
          metadata:
            name: nrpalice-select
          spec:
            forProvider:
              databaseName: nrpdb
              granteeUserName: nrpalice
              privilegeName: SELECT
              tableName: events
            providerConfigRef:
              kind: ClusterProviderConfig
              name: default
    - apply:
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: GrantPrivilege
          metadata:
            name: nrpbob-select
          spec:
            forProvider:
              databaseName: nrpdb
              granteeUserName: nrpbob
              privilegeName: SELECT
              tableName: events
            providerConfigRef:
              kind: ClusterProviderConfig
              name: default
    - assert:
        timeout: 5m
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: GrantPrivilege
          metadata:
            name: nrpalice-select
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 5m
        resource:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: GrantPrivilege
          metadata:
            name: nrpbob-select
          status:
            (conditions[?type == 'Ready']):
            - status: "True"

  - name: create-row-policies
    try:
    - apply:
        resource:
          apiVersion: row.clickhousedbops.m.crossplane.io/v1alpha1
          kind: Policy
          metadata:
            name: nrp-alice-filter
          spec:
            forProvider:
              databaseName: nrpdb
              tableName: events
              selectFilter: "tenant = 'alice'"
              granteeNames:
              - nrpalice
            providerConfigRef:
              kind: ClusterProviderConfig
              name: default
    - apply:
        resource:
          apiVersion: row.clickhousedbops.m.crossplane.io/v1alpha1
          kind: Policy
          metadata:
            name: nrp-bob-filter
          spec:
            forProvider:
              databaseName: nrpdb
              tableName: events
              selectFilter: "tenant = 'bob'"
              granteeNames:
              - nrpbob
            providerConfigRef:
              kind: ClusterProviderConfig
              name: default
    - assert:
        timeout: 5m
        resource:
          apiVersion: row.clickhousedbops.m.crossplane.io/v1alpha1
          kind: Policy
          metadata:
            name: nrp-alice-filter
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 5m
        resource:
          apiVersion: row.clickhousedbops.m.crossplane.io/v1alpha1
          kind: Policy
          metadata:
            name: nrp-bob-filter
          status:
            (conditions[?type == 'Ready']):
            - status: "True"

  - name: verify-enforcement
    try:
    - script:
        shell: bash
        content: |
          set -euo pipefail

          ALICE_PW=$(kubectl get secret nrpalice -n "$NAMESPACE" -o jsonpath='{.data.password}' | base64 -d)
          BOB_PW=$(kubectl get secret nrpbob -n "$NAMESPACE" -o jsonpath='{.data.password}' | base64 -d)

          # Alice should see only 2 rows (tenant='alice')
          ALICE_COUNT=$(kubectl exec -n clickhouse deploy/clickhouse -- clickhouse-client \
            --user nrpalice --password "$ALICE_PW" \
            --query "SELECT count() FROM nrpdb.events")
          echo "alice row count: $ALICE_COUNT"
          [ "$ALICE_COUNT" -eq 2 ] || { echo "FAIL: alice expected 2 rows, got $ALICE_COUNT"; exit 1; }

          # Bob should see only 3 rows (tenant='bob')
          BOB_COUNT=$(kubectl exec -n clickhouse deploy/clickhouse -- clickhouse-client \
            --user nrpbob --password "$BOB_PW" \
            --query "SELECT count() FROM nrpdb.events")
          echo "bob row count: $BOB_COUNT"
          [ "$BOB_COUNT" -eq 3 ] || { echo "FAIL: bob expected 3 rows, got $BOB_COUNT"; exit 1; }

          echo "Row policy enforcement verified."
    finally:
    - delete:
        ref:
          apiVersion: row.clickhousedbops.m.crossplane.io/v1alpha1
          kind: Policy
          name: nrp-alice-filter
    - delete:
        ref:
          apiVersion: row.clickhousedbops.m.crossplane.io/v1alpha1
          kind: Policy
          name: nrp-bob-filter
    - delete:
        ref:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: GrantPrivilege
          name: nrpalice-select
    - delete:
        ref:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: GrantPrivilege
          name: nrpbob-select
    - delete:
        ref:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: User
          name: nrpalice
    - delete:
        ref:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: User
          name: nrpbob
    - script:
        shell: bash
        content: |
          kubectl exec -n clickhouse deploy/clickhouse -- clickhouse-client \
            --user default --password e2epassword \
            --query "DROP TABLE IF EXISTS nrpdb.events"
    - delete:
        ref:
          apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
          kind: Database
          name: nrpdb
