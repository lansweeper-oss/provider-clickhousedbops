apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: user-create-collision
# Validates the issue #104 fix for a cluster-scoped User: a managed User whose
# forProvider.name collides with an existing ClickHouse user must NOT silently
# adopt it. With no name resolver for users, the provider proceeds to CREATE USER,
# which fails loudly with "already exists" - surfaced on the MR as Synced=False.
#
# Legacy cluster-scoped resources use the cluster-wide clickhousedbops.crossplane.io
# ProviderConfig "default" from the e2e setup script. A dedicated ClickHouse name
# (coluser) avoids colliding with the other user tests and the uptest manifests.
spec:
  # Provider deletes are async (create/poll), so cleanup can exceed the default
  # delete timeout; give finally/cleanup deletes room to finish.
  timeouts:
    delete: 5m
    cleanup: 5m
  steps:
    - name: apply-user
      try:
        - apply:
            resource:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: coluser
              spec:
                forProvider:
                  name: coluser
                  autoGeneratePassword: true
                writeConnectionSecretToRef:
                  name: coluser
                  # Cluster-scoped User (legacy API): write to a stable namespace so the
                  # secret write survives ephemeral test-namespace teardown.
                  namespace: crossplane-system
                providerConfigRef:
                  name: default
        - assert:
            timeout: 5m
            resource:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: coluser
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"

    - name: collide-on-name
      try:
        - apply:
            resource:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: coluser-collide
              spec:
                forProvider:
                  name: coluser
                  autoGeneratePassword: true
                writeConnectionSecretToRef:
                  name: coluser-collide
                  namespace: crossplane-system
                providerConfigRef:
                  name: default
        # The colliding MR must fail loudly: CREATE USER hits "already exists"
        # and the error surfaces on the Synced condition. It must never turn
        # Ready - that would mean silent adoption.
        - assert:
            timeout: 5m
            resource:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: coluser-collide
              status:
                (conditions[?type == 'Synced']):
                  - status: "False"
                    (contains(message, 'already exists')): true
        - error:
            timeout: 30s
            resource:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: coluser-collide
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
      finally:
        # Delete order matters: remove the managed resources while the test namespace
        # still exists. The colliding MR never created its external resource, so its
        # delete resolves via "not found"; the managed user then cleans up normally.
        - delete:
            ref:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: User
              name: coluser-collide
        - delete:
            ref:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: User
              name: coluser
