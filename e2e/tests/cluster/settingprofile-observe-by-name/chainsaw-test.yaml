apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: settingprofile-observe-by-name
# Validates the adopt-by-name path for a cluster-scoped SettingProfile
# (clickhousedbops.crossplane.io, id observation field). A sibling Observe-only
# profile referencing an existing profile by name must be adopted (Synced/Ready),
# not re-created.
#
# Legacy cluster-scoped resources use the cluster-wide clickhousedbops.crossplane.io
# ProviderConfig "default" from the e2e setup script. A dedicated ClickHouse name
# (obsprofile) avoids colliding with the uptest manifest profile (testprofile).
spec:
  steps:
  - name: apply-settingprofile
    try:
    - apply:
        resource:
          apiVersion: clickhousedbops.crossplane.io/v1alpha1
          kind: SettingProfile
          metadata:
            name: obsprofile
          spec:
            forProvider:
              name: obsprofile
            providerConfigRef:
              name: default
    - assert:
        timeout: 5m
        resource:
          apiVersion: clickhousedbops.crossplane.io/v1alpha1
          kind: SettingProfile
          metadata:
            name: obsprofile
          status:
            conditions:
            - type: Ready
              status: "True"

  - name: observe-sibling-by-name
    try:
    - apply:
        resource:
          apiVersion: clickhousedbops.crossplane.io/v1alpha1
          kind: SettingProfile
          metadata:
            name: obsprofile-observe
          spec:
            forProvider:
              name: obsprofile
            managementPolicies:
            - Observe
            providerConfigRef:
              name: default
    - assert:
        timeout: 5m
        resource:
          apiVersion: clickhousedbops.crossplane.io/v1alpha1
          kind: SettingProfile
          metadata:
            name: obsprofile-observe
          status:
            conditions:
            - type: Synced
              status: "True"
            - type: Ready
              status: "True"
    finally:
    - delete:
        ref:
          apiVersion: clickhousedbops.crossplane.io/v1alpha1
          kind: SettingProfile
          name: obsprofile-observe
