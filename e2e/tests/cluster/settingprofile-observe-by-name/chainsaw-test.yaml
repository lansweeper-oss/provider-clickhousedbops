apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: settingprofile-observe-by-name
# Validates the adopt-by-name path for a cluster-scoped SettingProfile
# (clickhousedbops.crossplane.io, id observation field). A sibling Observe-only
# profile referencing an existing profile by name must be adopted (Synced/Ready),
# not re-created.
#
# Legacy cluster-scoped resources use the cluster-wide clickhousedbops.crossplane.io
# ProviderConfig "default" from the e2e setup script. A dedicated ClickHouse name
# (obsprofile) avoids colliding with the uptest manifest profile (testprofile).
spec:
  # Provider deletes are async (create/poll), so cleanup can exceed the default
  # delete timeout; give finally/cleanup deletes room to finish.
  timeouts:
    delete: 5m
    cleanup: 5m
  steps:
    - name: apply-settingprofile
      try:
        - apply:
            resource:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: SettingProfile
              metadata:
                name: obsprofile
              spec:
                forProvider:
                  name: obsprofile
                providerConfigRef:
                  name: default
        - assert:
            timeout: 5m
            resource:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: SettingProfile
              metadata:
                name: obsprofile
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"

    - name: observe-sibling-by-name
      try:
        - apply:
            resource:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: SettingProfile
              metadata:
                name: obsprofile-observe
              spec:
                forProvider:
                  name: obsprofile
                managementPolicies:
                  - Observe
                providerConfigRef:
                  name: default
        - assert:
            timeout: 5m
            resource:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: SettingProfile
              metadata:
                name: obsprofile-observe
              status:
                (conditions[?type == 'Synced']):
                  - status: "True"
                (conditions[?type == 'Ready']):
                  - status: "True"
      finally:
        # Delete the managed resources while the test namespace still exists (cluster-scoped
        # MRs outlive it); sibling first (Observe-only), then the managed profile.
        - delete:
            ref:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: SettingProfile
              name: obsprofile-observe
        - delete:
            ref:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: SettingProfile
              name: obsprofile
