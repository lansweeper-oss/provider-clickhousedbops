apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: user-observe-by-uuid
# Explicit UUID import for a cluster-scoped User: users are never adopted by
# name (#104), so an Observe-only sibling must pin crossplane.io/external-name
# to the existing user's UUID to reach Synced/Ready.
#
# Tests run concurrently against one shared ClickHouse, so this test owns the
# username "obsuser". Credentials come from the cluster-wide ProviderConfig
# "default" created by the e2e setup script.
spec:
  # Provider deletes are async (create/poll), so cleanup can exceed the default
  # delete timeout; give finally/cleanup deletes room to finish.
  timeouts:
    delete: 5m
    cleanup: 5m
  steps:
    - name: apply-user
      try:
        - apply:
            resource:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: obsuser
              spec:
                forProvider:
                  name: obsuser
                  autoGeneratePassword: true
                writeConnectionSecretToRef:
                  name: obsuser
                  # Cluster-scoped User (legacy API): write to a stable namespace so the
                  # secret write survives ephemeral test-namespace teardown.
                  namespace: crossplane-system
                providerConfigRef:
                  name: default
        - assert:
            timeout: 5m
            resource:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: obsuser
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
        - assert:
            timeout: 2m
            resource:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: obsuser
                annotations:
                  (crossplane.io/external-name != ''): true

    - name: observe-sibling-by-uuid
      try:
        # Capture the UUID into a binding; same step as the apply below because
        # bindings do not leak across steps. Generous timeout: the default 30s
        # got the script killed under CI load.
        - script:
            timeout: 2m
            shell: bash
            content: |
              set -euo pipefail
              kubectl get user.clickhousedbops.crossplane.io obsuser \
                -o go-template='{{index .metadata.annotations "crossplane.io/external-name"}}'
            outputs:
              - name: useruuid
                value: (trim_space($stdout))
        - apply:
            resource:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: obsuser-observe
                annotations:
                  crossplane.io/external-name: ($useruuid)
              spec:
                forProvider:
                  name: obsuser
                managementPolicies:
                  - Observe
                providerConfigRef:
                  name: default
        # Null-guarded: plain status: errors terminally while status is unset.
        - assert:
            timeout: 5m
            resource:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: User
              metadata:
                name: obsuser-observe
              ((status.conditions || `[]`)[?type == 'Synced']):
                - status: "True"
              ((status.conditions || `[]`)[?type == 'Ready']):
                - status: "True"
      finally:
        # Delete while the test namespace exists (secret re-apply on delete gets
        # stuck otherwise); sibling first, then the managed user.
        - delete:
            ref:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: User
              name: obsuser-observe
        - delete:
            ref:
              apiVersion: clickhousedbops.crossplane.io/v1alpha1
              kind: User
              name: obsuser
