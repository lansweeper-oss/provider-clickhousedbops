apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: grantrole-order
# GrantRole references its grantee user and role by plain name (no Ref/Selector),
# so crossplane does not order creation: applied together, GrantRole reconciles
# before the user/role exist and only converges on a later retry. This test makes
# the dependency order explicit with sequential chainsaw steps - the role and user
# must be Ready before GrantRole is applied - so the grant succeeds on first try.
#
# Legacy cluster-scoped resources use the cluster-wide clickhousedbops.crossplane.io
# ProviderConfig "default" from the e2e setup script. Dedicated names (ord*) avoid
# colliding with the uptest manifests.
spec:
  # Provider deletes are async (create/poll), so cleanup can exceed the default
  # delete timeout; give finally/cleanup deletes room to finish.
  timeouts:
    delete: 5m
    cleanup: 5m
  steps:
  - name: create-role
    try:
    - apply:
        resource:
          apiVersion: clickhousedbops.crossplane.io/v1alpha1
          kind: Role
          metadata:
            name: ordrole
          spec:
            forProvider:
              name: ordrole
            providerConfigRef:
              name: default
    - assert:
        timeout: 5m
        resource:
          apiVersion: clickhousedbops.crossplane.io/v1alpha1
          kind: Role
          metadata:
            name: ordrole
          status:
            (conditions[?type == 'Ready']):
            - status: "True"

  - name: create-user
    try:
    - apply:
        resource:
          apiVersion: clickhousedbops.crossplane.io/v1alpha1
          kind: User
          metadata:
            name: orduser
          spec:
            forProvider:
              name: orduser
              autoGeneratePassword: true
            writeConnectionSecretToRef:
              name: orduser
              namespace: crossplane-system
            providerConfigRef:
              name: default
    - assert:
        timeout: 5m
        resource:
          apiVersion: clickhousedbops.crossplane.io/v1alpha1
          kind: User
          metadata:
            name: orduser
          status:
            (conditions[?type == 'Ready']):
            - status: "True"

  - name: create-grantrole
    try:
    - apply:
        resource:
          apiVersion: clickhousedbops.crossplane.io/v1alpha1
          kind: GrantRole
          metadata:
            name: ordgrantrole
          spec:
            forProvider:
              granteeUserName: orduser
              roleName: ordrole
            providerConfigRef:
              name: default
    - assert:
        timeout: 5m
        resource:
          apiVersion: clickhousedbops.crossplane.io/v1alpha1
          kind: GrantRole
          metadata:
            name: ordgrantrole
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    finally:
    # Reverse dependency order, while the test namespace still exists: grant first,
    # then the user (whose connection secret lives in crossplane-system), then the role.
    - delete:
        ref:
          apiVersion: clickhousedbops.crossplane.io/v1alpha1
          kind: GrantRole
          name: ordgrantrole
    - delete:
        ref:
          apiVersion: clickhousedbops.crossplane.io/v1alpha1
          kind: User
          name: orduser
    - delete:
        ref:
          apiVersion: clickhousedbops.crossplane.io/v1alpha1
          kind: Role
          name: ordrole
