apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: database-observe-by-name
# Validates the no-fork adopt-by-name path for a cluster-scoped Database
# (clickhousedbops.crossplane.io): a sibling Observe-only Database referencing an
# existing ClickHouse database by name must be adopted (Synced/Ready), not
# re-created. The adopt initializer resolves the name to the real UUID so the
# provider's UUID-based Read finds the row.
#
# Legacy cluster-scoped resources resolve their provider config only via the
# cluster-wide clickhousedbops.crossplane.io ProviderConfig (a ClusterProviderConfig
# belongs to the m. API group and is not usable here); the "default" ProviderConfig
# is created by the e2e setup script. A dedicated ClickHouse name (obsdb) avoids
# colliding with the uptest manifest database (testdb).
spec:
  steps:
  - name: apply-database
    try:
    - apply:
        resource:
          apiVersion: clickhousedbops.crossplane.io/v1alpha1
          kind: Database
          metadata:
            name: obsdb
          spec:
            forProvider:
              name: obsdb
            providerConfigRef:
              name: default
    - assert:
        timeout: 5m
        resource:
          apiVersion: clickhousedbops.crossplane.io/v1alpha1
          kind: Database
          metadata:
            name: obsdb
          status:
            conditions:
            - type: Ready
              status: "True"

  - name: observe-sibling-by-name
    try:
    - apply:
        resource:
          apiVersion: clickhousedbops.crossplane.io/v1alpha1
          kind: Database
          metadata:
            name: obsdb-observe
          spec:
            forProvider:
              name: obsdb
            managementPolicies:
            - Observe
            providerConfigRef:
              name: default
    - assert:
        timeout: 5m
        resource:
          apiVersion: clickhousedbops.crossplane.io/v1alpha1
          kind: Database
          metadata:
            name: obsdb-observe
          status:
            conditions:
            - type: Synced
              status: "True"
            - type: Ready
              status: "True"
    finally:
    - delete:
        ref:
          apiVersion: clickhousedbops.crossplane.io/v1alpha1
          kind: Database
          name: obsdb-observe
