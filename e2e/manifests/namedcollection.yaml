apiVersion: v1
kind: Secret
metadata:
  name: testcollection-keys
  namespace: crossplane-system
stringData:
  format: CSV
  url: https://example.com/bucket/
  secret_access_key: s3cr3t
---
apiVersion: clickhousedbops.crossplane.io/v1alpha1
kind: NamedCollection
metadata:
  annotations:
    meta.upbound.io/example-id: clickhousedbops/v1alpha1/namedcollection
  labels:
    testing.upbound.io/example-name: testcollection
  name: testcollection
spec:
  forProvider:
    keysSecretRef:
      name: testcollection-keys
      namespace: crossplane-system
    overridableKeys:
      - url
    notOverridableKeys:
      - secret_access_key
