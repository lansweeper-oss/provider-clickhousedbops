apiVersion: clickhousedbops.m.crossplane.io/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: clickhousedbops/v1alpha1/user
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    auth:
      sha256Hash:
      - valueWoSecretRef:
          key: example-key
          name: example-secret
        valueWoVersion: 1
      sslCertificate:
      - commonName: example-service
    name: example
