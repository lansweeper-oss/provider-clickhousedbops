        description: 'NamedCollection is the Schema for the NamedCollections API.
          You can use the clickhousedbops_named_collection resource to create a Named
          Collection https://clickhouse.com/docs/operations/named-collections in a
          ClickHouse instance. On ClickHouse Cloud, DDL named collections are only
          enabled on select services: contact ClickHouse support to confirm availability.
          On self-hosted instances, managing them with DDL needs the named_collection_control
          privilege, which is not granted with GRANT: it is enabled per user in the
          server config, usually a file in /etc/clickhouse-server/users.d/.11. ClickHouse
          never returns these values, so the provider cannot tell when one changes:
          bump secret_keys_wo_version to re-apply all of them.keys is stored in the
          state. Both maps write into the same set of keys in ClickHouse, so a key
          name can only appear in one of them. Known limitations ClickHouse hides
          named collection values in system tables unless the current user is granted
          SHOW NAMED COLLECTIONS SECRETS. Without that grant the provider only detects
          drift on the set of key names, not on the values of keys.ClickHouse can''t
          reset a key''s flag back to the server default. Removing a key from overridable_keys
          or not_overridable_keys while keeping it in the collection destroys and
          recreates the collection. Moving it to the other list is done in place.Renaming
          a collection is not supported by ClickHouse, so changing name (or cluster_name)
          destroys and recreates the collection.When importing an existing collection,
          values are imported as the literal [HIDDEN] placeholder unless the user
          can see secrets.'
